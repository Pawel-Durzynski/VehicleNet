name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/VehicleNet.slnx

      - name: Build solution
        run: dotnet build src/VehicleNet.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/VehicleNet.slnx --configuration Release --no-build --verbosity normal
